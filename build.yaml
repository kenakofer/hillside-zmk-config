# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano//zmk
#     shield: reviung41
#
---
include:
# Hillside 52
  # Logging is on the left half only: it is the split central, so hold-tap
  # decisions happen there, and it is the half plugged into USB.
  # DIAGNOSTIC ONLY -- drop the snippet line (and the log config in
  # hillside52.conf) once hold-tap tuning is done. It costs battery life.
  - board: nice_nano//zmk
    shield: hillside52_left
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: hillside52_right
