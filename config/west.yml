manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: benjaminciq
      url-base: https://github.com/BenjaminCIQ

  projects:
    # Both pinned to main: zmk-dynamic-macros uses ZMK_KEYMAP_LAYERS_FOREACH,
    # which landed after the v0.3 release and only exists on ZMK main. The
    # module's own CI tests against zmk-version: main for the same reason.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-dynamic-macros
      remote: benjaminciq
      revision: main
  self:
    path: config
