# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable mouse support (merged upstream as of ZMK v0.3)
CONFIG_ZMK_POINTING=y

# Configure dynamic macros (zmk-dynamic-macros module).
# The behavior itself is enabled automatically by the devicetree node, so
# there is no longer a CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO=y line to set.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_MAX_EVENTS=64
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_TAP_DELAY=15
# One RAM-only slot, matching the previous MAX_SLOTS=1 behavior.
# Persistence off, so nothing is written to flash and NVS_SLOTS does not apply.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_PERSIST=n
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_RAM_SLOTS=1
# All slots share a pool of AVG_EVENTS_PER_SLOT x slots events, and MAX_EVENTS
# must fit inside it. With a single slot the average has to equal the max, or
# the one slot could not hold a full-length macro.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_AVG_EVENTS_PER_SLOT=64
