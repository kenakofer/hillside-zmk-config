# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable mouse support (merged upstream as of ZMK v0.3)
CONFIG_ZMK_POINTING=y

# Configure dynamic macros (zmk-dynamic-macros module).
# The behavior itself is enabled automatically by the devicetree node, so
# there is no longer a CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO=y line to set.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_MAX_EVENTS=64
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_TAP_DELAY=15
# One RAM-only slot, matching the previous MAX_SLOTS=1 behavior.
# Persistence off, so nothing is written to flash and NVS_SLOTS does not apply.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_PERSIST=n
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_RAM_SLOTS=1
# All slots share a pool of AVG_EVENTS_PER_SLOT x slots events, and MAX_EVENTS
# must fit inside it. With a single slot the average has to equal the max, or
# the one slot could not hold a full-length macro.
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_AVG_EVENTS_PER_SLOT=64
# Feedback defaults to VERBOSE, which types [DM REC] / [DM STOP] / [DM SAVED]
# into the focused window on every command. Drop to errors only: the normal
# record/stop/save path goes silent, but a save rejected because the slot is
# already full still types [DM SLOT R0: -]. That message matters -- with a
# single slot and no DM_DEL key, it is the cue to clear the slot with
# &sys_reset (slots are RAM-only, so a reset wipes them).
CONFIG_ZMK_BEHAVIOR_DYNAMIC_MACRO_FEEDBACK_ERROR=y

# ---------------------------------------------------------------------------
# DIAGNOSTIC ONLY -- hold-tap tuning. Remove this block and the
# "snippet: zmk-usb-logging" line in build.yaml when finished.
#
# The zmk-usb-logging snippet in build.yaml does the work: ZMK_USB_LOGGING
# selects LOG, and ZMK_LOG_LEVEL already defaults to 4 (debug), so no extra
# Kconfig is needed here to get behavior_hold_tap's per-decision line:
#
#   <dbg> zmk: decide_hold_tap: 21 decided hold (balanced decision moment key-down)
#
# giving key position, hold vs tap, flavor, trigger, and a ms timestamp.
# Read it on Linux with:  sudo tio /dev/ttyACM0
#
# Only the left half needs it: it is the split central, so it runs the keymap
# and decides every hold-tap, including the right half's. Right-hand key events
# arrive over BLE with extra latency, which is visible in the timestamps.
#
# Uncomment to silence ZMK debug output without removing the snippet:
# CONFIG_ZMK_LOGGING_MINIMAL=y
#
# Logging raises power draw and perturbs timing slightly, so treat the numbers
# as directional and re-check the feel with this turned back off.
# ---------------------------------------------------------------------------
